<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">

<title>NOVA BREAKER</title>
<style>
/* ===== 画面全体 ===== */
html,body{touch-action:none;overscroll-behavior:none;margin:0;height:100%;overflow:hidden;background:#04060c;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;position:fixed;inset:0}
#w{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font-family:inherit}

/* ===== プレイ中のボタン ===== */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#pauseBtn{position:absolute;top:2.6cqw;right:1.2cqw;width:5.4cqw;height:5.4cqw;border-radius:1cqw;border:2px solid #ffffff50;background:#00000070;color:#fff;font-weight:900;font-size:2cqw;pointer-events:auto;padding:0}
#skillBtn{position:absolute;right:1.6cqw;bottom:1.6cqw;width:12.5cqw;height:12.5cqw;border-radius:50%;border:none;pointer-events:auto;padding:0;background:conic-gradient(var(--sc,#7fd1ff) calc(var(--g,0)*1%),#ffffff1c 0);display:flex;align-items:center;justify-content:center}
#skillBtn span{width:84%;height:84%;border-radius:50%;background:#0a0e1ae6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9cqw;font-weight:900;line-height:1.15;text-align:center}
#skillBtn small{font-size:1.15cqw;font-weight:700;color:#cfe0ff}
#skillBtn.ready{animation:pulse .7s infinite alternate}
#skillBtn.ready span{background:radial-gradient(circle,#ffffff38,#0a0e1ae6 70%)}
@keyframes pulse{from{box-shadow:0 0 .8cqw var(--sc)}to{box-shadow:0 0 4cqw var(--sc)}}

/* ===== 共通の画面パーツ ===== */
.s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3cqw;padding:2cqw;box-sizing:border-box;color:#e8eaf6;font-size:1.8cqw;background:radial-gradient(circle,#121830f2,#03050cf8);text-align:center;overflow-y:auto}
h1{font-size:6.4cqw;margin:0;background:linear-gradient(180deg,#bcd8ff,#4a6ae0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:.1em}
h1.d{background:linear-gradient(180deg,#ffb0b8,#ff2050);-webkit-background-clip:text;background-clip:text}
h1.c{background:linear-gradient(180deg,#fff2b0,#ffb020);-webkit-background-clip:text;background-clip:text}
h2{font-size:3.2cqw;margin:0;color:#c0d0ff;letter-spacing:.05em}
.sub{color:#8a9ac0;font-size:1.6cqw}
.btn{font-size:2.2cqw;font-weight:800;padding:1.1cqw 3.2cqw;background:linear-gradient(180deg,#2a3a6a,#182240);color:#e8eaf6;border:2px solid #4a5a9a;border-radius:.7cqw;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.g{background:linear-gradient(180deg,#6a5220,#3a2c10);border-color:#a0842a}
.btn.big{font-size:2.8cqw;padding:1.3cqw 5cqw;background:linear-gradient(180deg,#3a6ad8,#1a3a8a);border-color:#8ab0ff}
.row{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center}
.gold{font-size:2.6cqw;font-weight:900;color:#ffc84a}

/* ===== レベルアップ ===== */
.cards{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center;max-width:96cqw}
.card{width:25cqw;padding:1.4cqw;background:#ffffff12;border:2px solid var(--c);border-radius:.9cqw;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.5cqw}
.cr{font-size:1.3cqw;color:var(--c);font-weight:800;letter-spacing:.1em}
.ci{width:6cqw;height:6cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.8cqw;font-weight:900;background:#ffffff10;border:2px solid var(--c);color:var(--c)}
.cn{font-size:2.1cqw;font-weight:800}
.cd{font-size:1.6cqw;color:#c0c8e0}

/* ===== ステージ選択 ===== */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw;width:90cqw}
.st{padding:1.3cqw 1.5cqw;border-radius:.9cqw;border:2px solid var(--c);background:linear-gradient(160deg,var(--b),#0a0e1a);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.35cqw;min-height:11cqw;box-sizing:border-box}
.st.l{opacity:.35;filter:grayscale(1)}
.stn{font-size:2.3cqw;font-weight:900}
.sts{font-size:1.4cqw;color:#b8c0d8}
.stc{font-size:1.5cqw;color:#ffd84a;font-weight:800}

/* ===== キャラ選択 ===== */
.cs{display:flex;gap:1.6cqw;align-items:stretch;width:94cqw}
.cl{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;flex:1}
.cc{padding:.6cqw;background:#ffffff0a;border:2px solid #ffffff22;border-radius:.7cqw;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cc.sel{border-color:var(--c);background:#ffffff1e}
.cc.l{opacity:.3}
.cp{width:9cqw;height:9cqw}
.ccn{font-size:1.9cqw;font-weight:800;color:var(--c)}
.cct{font-size:1.3cqw;color:#9aa4c0}
.cdp{flex:1.05;padding:1.6cqw;border:2px solid var(--c);border-radius:.9cqw;background:#0a0e1acc;text-align:left;display:flex;flex-direction:column;gap:.8cqw;font-size:1.7cqw;box-sizing:border-box}
.cdp h3{margin:0;font-size:3cqw;color:var(--c)}
.tag{display:inline-block;padding:.25cqw .9cqw;border-radius:.5cqw;background:#ffffff1a;font-size:1.45cqw;margin:0 .4cqw .4cqw 0}
.kv{color:#8a9ac0;font-size:1.4cqw}
.sk{color:#ffe08a;font-weight:800}

/* ===== リザルト・ガチャ ===== */
.stats{display:flex;gap:3cqw;font-size:2.2cqw;flex-wrap:wrap;justify-content:center}
.stats>div{display:flex;flex-direction:column;gap:.3cqw}
.stats span:first-child{font-size:1.4cqw;color:#7a8ab0}
.stats span:last-child{font-weight:900;color:#ffc84a}
.gr{display:flex;gap:.8cqw;flex-wrap:wrap;justify-content:center;min-height:9cqw;max-width:92cqw}
.gc{width:18cqw;padding:.9cqw;background:#ffffff10;border:2px solid var(--c);border-radius:.6cqw;display:flex;flex-direction:column;align-items:center;gap:.3cqw}
.gcn{font-size:1.4cqw;font-weight:800;color:var(--c)}
.gct{font-size:1.7cqw;color:#d8e0f0}
.wl{display:flex;gap:.8cqw;flex-wrap:wrap;justify-content:center;max-width:90cqw}
.wl span{padding:.4cqw 1cqw;border-radius:.5cqw;border:1px solid var(--c);color:var(--c);font-size:1.5cqw;font-weight:700}

/* ===== 演出 ===== */
#banner{position:absolute;top:19%;left:0;right:0;text-align:center;font-size:3.6cqw;font-weight:900;color:#fff;text-shadow:0 0 1.5cqw #000,0 0 3cqw currentColor;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 4cqw}
#banner.show{opacity:1}
#stk{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #7fd1ff80;background:#7fd1ff14;pointer-events:none;display:none;z-index:9}
#stk i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#7fd1ff80;border:2px solid #cfeaff}

.evh{color:#ffe45a;font-weight:700;font-size:.85em}
.card.evo{background:linear-gradient(135deg,#ffe45a30,#ff7ac830,#7ad8ff30);box-shadow:0 0 3cqw #ffd84a90;animation:evg 1s infinite alternate}
@keyframes evg{to{box-shadow:0 0 5cqw #fff6c0;transform:scale(1.04)}}
</style>

<div id="w">
 <canvas id="c" width="1280" height="720"></canvas>
 <div id="hud"><button id="pauseBtn">II</button><button id="skillBtn"><span id="skillTxt">0%</span></button></div>
 <div id="ui"></div>
 <div id="banner"></div>
</div>
<div id="stk"><i id="stkb"></i></div>
<script>
// ---- js/core.js ----
// 動作エラーを画面に出す（原因調べ用）
window.addEventListener('error',e=>{let d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#400;color:#fff;font:12px/1.4 monospace;padding:6px;white-space:pre-wrap;max-height:50vh;overflow:auto';document.body.appendChild(d)}d.textContent+=(e.message||'')+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+'\n'});
"use strict";
// ===== 基本設定・共通関数・セーブデータ =====
const W=1280,H=720,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui'),banner=document.getElementById('banner'),hud=document.getElementById('hud');
ctx.imageSmoothingEnabled=false;

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>(ax-bx)**2+(ay-by)**2;
const chance=p=>Math.random()<p;
const hash2=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const fmtTime=t=>{t=Math.max(0,Math.ceil(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// セーブデータ
const SK='nb3';
const S={gold:0,unlocked:['ao'],perms:{},cleared:{},best:{},lastChar:'ao'};
try{const o=JSON.parse(localStorage.getItem(SK)||'null');if(o&&typeof o==='object')Object.assign(S,o)}catch(e){}
function saveNow(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}

// レアリティ
const RAR=[{n:'COMMON',c:'#9aa4b8',w:50,m:1},{n:'UNCOMMON',c:'#5ce08a',w:28,m:1.5},{n:'RARE',c:'#4aa8ff',w:14,m:2},{n:'EPIC',c:'#b06aff',w:6,m:2.7},{n:'LEGENDARY',c:'#ffc23a',w:2,m:3.6}];
function rollRar(){let t=RAR.reduce((s,r)=>s+r.w,0),v=Math.random()*t;for(let i=0;i<RAR.length;i++){v-=RAR[i].w;if(v<=0)return i}return 0}

// ガチャで上がる恒久強化
const PERMS={damage:{n:'攻撃力',p:.04},hp:{n:'最大HP',p:8},speed:{n:'移動速度',p:.03},cooldown:{n:'攻撃速度',p:.02},magnet:{n:'回収範囲',p:.06},greed:{n:'獲得ゴールド',p:.05}};
const permV=k=>(S.perms[k]||0)*PERMS[k].p;

// ゲームの状態
let ST='title',LMT=0,nextId=1;
const G={};
function resetG(){
 Object.assign(G,{p:null,en:[],pr:[],ep:[],or:[],items:[],zones:[],fx:[],pt:[],dn:[],cam:{x:-W/2,y:-H/2},
  stage:null,sc:null,si:0,t:0,kills:0,goldRun:0,boss:null,bossSpawned:false,midSpawned:false,spawnT:0,evIdx:0,
  freeze:0,shake:0,pend:0,tv:null,anim:0,flash:0});
}
resetG();

function hideBanner(){clearTimeout(showBanner._t);banner.classList.remove('show')}
function showBanner(txt,col){
 banner.textContent=txt;banner.style.color=col||'#fff';banner.classList.add('show');
 clearTimeout(showBanner._t);showBanner._t=setTimeout(()=>banner.classList.remove('show'),1600);
}

// ---- js/gfx/pixel.js ----
// ===== ドット絵の部品 =====
// 色の濃淡（5段階）、立体感、輪郭、歩きの動きをここで自動で付ける
const _rgb={};
function rgb(h){let c=_rgb[h];if(c)return c;const n=parseInt(h.slice(1),16);return _rgb[h]=[n>>16&255,n>>8&255,n&255]}
function hexc(r,g,b){return'#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1)}
function mixc(a,b,t){const A=rgb(a),B=rgb(b);return hexc(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
const _ramp={};
// 0:いちばん暗い 1:影 2:ふつう 3:明るい 4:光の反射
function ramp(base){let r=_ramp[base];if(r)return r;return _ramp[base]=[mixc(base,'#140a28',.66),mixc(base,'#2a1a5a',.36),base,mixc(base,'#fff0c8',.34),mixc(base,'#ffffff',.74)]}

class PX{
 constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
 set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c}
 get(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h?this.d[y*this.w+x]:null}
 rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
 // 角ばった物：左上が明るく、右下が暗い
 box(x,y,w,h,base){const R=ramp(base);for(let j=0;j<h;j++)for(let i=0;i<w;i++){let k=2;if(j===0||i===0)k=3;if(j===h-1||i===w-1)k=1;if(w>5&&i===w-2&&j>0)k=Math.min(k,1.5)|0||1;this.set(x+i,y+j,R[k])}}
 // 球のような立体の楕円
 ell(cx,cy,rx,ry,base,o){
  o=o||{};const R=ramp(base),lx=o.lx!=null?o.lx:-.55,ly=o.ly!=null?o.ly:-.65,lz=.5,ll=Math.hypot(lx,ly,lz),clip=o.clip;
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
   if(clip&&!clip(x,y))continue;
   const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry,q=nx*nx+ny*ny;if(q>1)continue;
   const l=(nx*lx+ny*ly+Math.sqrt(1-q)*lz)/ll;
   this.set(x,y,R[Math.max(o.min||0,l>.9?4:l>.62?3:l>.2?2:l>-.2?1:0)]);
  }
 }
 // 多角形（頂点の位置で明るさが変わる）
 poly(pts,base,o){
  o=o||{};const R=ramp(base);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const[x,y]of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const bw=x1-x0+1,bh=y1-y0+1;
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){
   let ins=false;const px=x+.5,py=y+.5;
   for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}
   if(!ins)continue;
   const s=((px-x0)/bw)*.55+((py-y0)/bh)*.45;
   this.set(x,y,R[o.flat?2:s<.2?3:s<.7?2:1]);
  }
 }
 line(x0,y0,x1,y1,c,th){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);th=th||1;
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){for(let a=0;a<th;a++)for(let b=0;b<th;b++)this.set(x0+a,y0+b,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}
 }
 // 別のPXを重ねる
 blit(o,ox,oy,flip){for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++){const c=o.d[y*o.w+x];if(c)this.set(ox+(flip?o.w-1-x:x),oy+y,c)}}
 // 2倍の細かさに拡大
 up2(){const n=new PX(this.w*2,this.h*2);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const c=this.d[y*this.w+x];if(c){n.set(x*2,y*2,c);n.set(x*2+1,y*2,c);n.set(x*2,y*2+1,c);n.set(x*2+1,y*2+1,c)}}return n}
}

// 輪郭を付けて画像にする（輪郭の色は隣の色を暗くしたもの）
function finishPX(px,o){
 o=o||{};const w=px.w+2,h=px.h+2,cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');
 for(let y=0;y<px.h;y++)for(let x=0;x<px.w;x++){const c=px.d[y*px.w+x];if(c){g.fillStyle=c;g.fillRect(x+1,y+1,1,1)}}
 if(o.outline!==false)for(let y=-1;y<=px.h;y++)for(let x=-1;x<=px.w;x++){
  if(px.get(x,y))continue;
  const n=px.get(x-1,y)||px.get(x+1,y)||px.get(x,y-1)||px.get(x,y+1);
  if(n){g.fillStyle=o.outline||mixc(n,'#0a0612',.8);g.fillRect(x+1,y+1,1,1)}
 }
 return cv;
}

// スプライト（何コマかの画像のまとまり）
const SPRITES={};
function makeSprite(name,w,h,frames,draw,opts){
 const fr=[];for(let f=0;f<frames;f++){const px=new PX(w,h);draw(px,f);fr.push(finishPX(px,opts))}
 return SPRITES[name]={name,w:w+2,h:h+2,frames:fr,n:frames,flash:[]};
}
function flashOf(s,f){
 if(!s.flash[f]){const c=document.createElement('canvas');c.width=s.w;c.height=s.h;const g=c.getContext('2d');g.drawImage(s.frames[f],0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#fff';g.fillRect(0,0,s.w,s.h);s.flash[f]=c}
 return s.flash[f];
}
// 中心を(x,y)に置いて描く
function drawSprite(s,f,x,y,sc,flip,flash,alpha,sx,sy){
 const img=flash?flashOf(s,f):s.frames[f],w=s.w*sc*(sx||1),h=s.h*sc*(sy||1),oa=ctx.globalAlpha;
 if(alpha!=null)ctx.globalAlpha=oa*alpha;
 if(flip){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(-1,1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()}
 else ctx.drawImage(img,Math.round(x-w/2),Math.round(y-h/2),w,h);
 ctx.globalAlpha=oa;
}

// ---- js/gfx/doll.js ----
// ===== 人型キャラの描き方（髪型・服・持ち物を変えて、キャラも敵も作る） =====
// 画像の大きさは 26x37。足は4コマで歩く
const DW=26,DH=37;
function dollHairBack(px,P,bob){
 if(P.hs==='long')px.box(6,9+bob,14,17,P.hair);
 else if(P.hs==='twin'){px.box(3,10+bob,4,14,P.hair);px.box(19,10+bob,4,14,P.hair)}
 else if(P.hs==='hood'){px.poly([[4,18+bob],[22,18+bob],[20,29+bob],[6,29+bob]],P.hood)}
}
function dollHairFront(px,P,bob){
 const hs=P.hs,H=P.hair,hy=12+bob;
 const dome=(ry,yl)=>px.ell(13,10+bob,7.3,ry,H,{clip:(x,y)=>y<=yl+bob});
 if(hs==='long'||hs==='twin'||hs==='short'||hs==='spiky'||hs==='hat'){
  dome(5.4,10);
  const bang=hs==='spiky'?[[7,11],[8,11],[18,11],[19,11],[9,10],[17,10]]:hs==='short'?[[6,11],[7,11],[19,11],[20,11],[7,12],[19,12]]:[[6,11],[7,11],[8,11],[10,11],[11,11],[15,11],[17,11],[18,11],[19,11],[20,11],[6,12],[7,12],[19,12],[20,12],[6,13],[20,13]];
  for(const[x,y]of bang)px.set(x,y+bob,ramp(H)[2]);
  for(const[x,y]of bang)if(y===11&&x%2)px.set(x,y+bob,ramp(H)[3]);

// ===== 光・火花・パーティクルの部品 =====
const _gl={};
function glowImg(c){
 if(_gl[c])return _gl[c];const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');
 const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'#ffffff');gr.addColorStop(.18,c);gr.addColorStop(.5,c+'55');gr.addColorStop(1,c+'00');
 g.fillStyle=gr;g.fillRect(0,0,s,s);return _gl[c]=cv;
}
// 加算で光らせる（使う前後で additive(true/false) を切り替える）
function additive(on){ctx.globalCompositeOperation=on?'lighter':'source-over'}
function glow(x,y,r,c,a){ctx.globalAlpha=a==null?1:a;ctx.drawImage(glowImg(c),x-r,y-r,r*2,r*2)}

// 粒（g:光る / ln:線）
function spawnPt(x,y,col,n,sp,o){
 if(G.pt.length>520)return;o=o||{};
 for(let i=0;i<n;i++){const a=o.a!=null?o.a+rand(-(o.sp||.5),o.sp||.5):Math.random()*TAU,s=rand(40,220)*sp,l=rand(.25,.55)*(o.life||1);
  G.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,r:o.r||rand(2,4.5),c:col,g:o.g!=null?o.g:1,ln:o.ln||0,fr:o.fr||.92,grav:o.grav||0})}
}
// 火花（細い線が飛ぶ）
function sparks(x,y,col,n,a,spread){spawnPt(x,y,col,n,2.2,{ln:1,a:a,sp:spread||Math.PI,r:2.2,life:.55,fr:.88})}
function ringFx(x,y,r,c,life,w){G.fx.push({k:'ring',x,y,r,life:life||.4,max:life||.4,c,w:w||8})}
// 当たった時の演出
function hitFx(e,dmg,sx,sy){
 const a=Math.atan2(e.y-sy,e.x-sx),big=dmg>=G.p.dmg*3;
 sparks(e.x,e.y-e.r*.3,big?'#ffd84a':'#fff3c0',big?7:3,a,.9);
 if(G.fx.length<120)G.fx.push({k:'hit',x:e.x,y:e.y-e.r*.2,a:a+rand(-.5,.5),life:.14,max:.14,s:big?1.5:1});
}
// 倒した時の演出
function deathFx(e){
 const c=e.pal.a||e.pal.t||'#fff',s=e.boss?1:Math.min(1,.5+e.r/60);
 ringFx(e.x,e.y,(e.boss?260:34+e.r*1.1),'#ffffff',e.boss?.6:.25,e.boss?10:4);
 spawnPt(e.x,e.y,c,e.boss?70:9+Math.round(e.r/6),e.boss?1.6:.9);
 spawnPt(e.x,e.y,'#ffffff',e.boss?20:4,1.2,{r:2});
 G.fx.push({k:'boom',x:e.x,y:e.y,r:e.boss?150:22+e.r*.8,life:.28,max:.28,c:c});
}

// ===== ステージ背景（ドット絵の地面・飾り・舞う粒・周辺の暗がり） =====
const BG={};
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
// 32x32の地面タイル（4種）。2倍に拡大して使う
function makeTiles(stg,key){
 const b=stg.bg,out=[];
 for(let v=0;v<4;v++){
  const px=new PX(32,32),r=rng(key*131+v*17+7);
  px.rect(0,0,32,32,b[0]);
  // 濃淡のむら
  for(let i=0;i<9;i++){const cx=r()*32,cy=r()*32,rx=3+r()*7,ry=2+r()*5;for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if(x*x/(rx*rx)+y*y/(ry*ry)<=1)for(const ox of[0,32,-32])for(const oy of[0,32,-32])px.set(cx+x+ox,cy+y+oy,i%3?b[1]:mixc(b[0],b[2],.12))}
  // 細かい点
  for(let i=0;i<26;i++)px.set(r()*32,r()*32,i%4?b[3]:mixc(b[3],'#ffffff',.18));
  // ステージごとの模様
  const d=stg.deco;
  if(d==='grass')for(let i=0;i<6;i++){const x=r()*30|0,y=r()*28|0;px.set(x,y+2,b[2]);px.set(x,y+1,mixc(b[2],'#ffffff',.2));px.set(x+1,y+2,b[2])}
  else if(d==='grave')for(let i=0;i<3;i++){const x=r()*26|0,y=r()*30|0;px.rect(x,y,3+r()*4|0,1,mixc(b[0],'#000000',.3))}
  else if(d==='lava'){for(let i=0;i<2;i++){let x=r()*32,y=r()*32;for(let k=0;k<9;k++){px.set(x,y,'#ff7a2a');px.set(x+1,y,'#8a2a14');x+=r()*3-1;y+=r()*2.2}}}
  else if(d==='ice')for(let i=0;i<3;i++){const x=r()*28|0,y=r()*30|0;px.line(x,y,x+3,y+1,mixc(b[2],'#ffffff',.3))}
  else if(d==='brick'){px.rect(0,0,32,1,mixc(b[0],'#000',.45));px.rect(0,16,32,1,mixc(b[0],'#000',.45));px.rect(v%2?10:22,0,1,16,mixc(b[0],'#000',.45));px.rect(v%2?22:10,16,1,16,mixc(b[0],'#000',.45));px.rect(1,1,30,1,mixc(b[0],'#fff',.05));px.rect(1,17,30,1,mixc(b[0],'#fff',.05))}
  else if(d==='void')for(let i=0;i<2;i++){const x=r()*28|0,y=r()*28|0;px.set(x,y,'#9a6aff');px.set(x+1,y,b[2])}
  const cv=document.createElement('canvas');cv.width=cv.height=32;const g=cv.getContext('2d');
  for(let y=0;y<32;y++)for(let x=0;x<32;x++){const c=px.d[y*32+x];if(c){g.fillStyle=c;g.fillRect(x,y,1,1)}}
  out.push(cv);
 }
 return out;
}

function buildBg(si){

 // 舞う粒（ステージごとの色）

function drawBg(stg,cx,cy){
 const si=STAGES.indexOf(stg),B=buildBg(si),gs=64,x0=Math.floor(cx/gs),y0=Math.floor(cy/gs),nx=Math.ceil(W/gs)+1,ny=Math.ceil(H/gs)+1;
 ctx.imageSmoothingEnabled=false;
 for(let i=0;i<=nx;i++)for(let j=0;j<=ny;j++){
  const gx=x0+i,gy=y0+j,h=hash2(gx,gy),sx=Math.round(gx*gs-cx),sy=Math.round(gy*gs-cy);
  ctx.drawImage(B.tiles[Math.floor(h*4)%4],sx,sy,gs,gs);
 }
 for(let i=-1;i<=nx;i++)for(let j=-1;j<=ny;j++){
  const gx=x0+i,gy=y0+j,h=hash2(gx*3+1,gy*5+2);
  if(h>.74){const k=Math.floor(hash2(gy,gx)*3),im=B.props[k];if(!im)continue;const sx=Math.round(gx*gs-cx+hash2(gx+9,gy)*40),sy=Math.round(gy*gs-cy+hash2(gx,gy+9)*40),sc=2+(h>.93?1:0);

   ctx.drawImage(im,sx,sy,im.width*sc,im.height*sc)}
 }
}
// 画面の手前に舞う粒と暗がり（最後に描く）
function drawBgFront(stg,cx,cy){
 const B=buildBg(STAGES.indexOf(stg)),t=G.anim||performance.now()/1000,d=stg.deco;
 additive(true);
 for(const m of B.mote){
  let x=m.x,y=m.y;
  if(d==='ice'){y=(m.y+t*60*m.z)%H;x=(m.x+Math.sin(t+m.ph)*30)%W}
  else if(d==='lava'){y=H-((H-m.y)+t*70*m.z)%H;x=(m.x+Math.sin(t*2+m.ph)*18)%W}
  else{x=(m.x+Math.sin(t*.6+m.ph)*50+t*8*m.z)%W;y=(m.y+Math.cos(t*.5+m.ph)*35)%H}
  x=((x-cx*.35*m.z)%W+W)%W;y=((y-cy*.35*m.z)%H+H)%H;
  const a=(.35+.35*Math.sin(t*2+m.ph))*(.5+m.z*.5);glow(x,y,6+m.z*7,m.c,a);
 }
 additive(false);ctx.globalAlpha=1;
 ctx.drawImage(vignette(),0,0,W,H);
}

// 覚醒中は「武器レベル+5・攻撃力と範囲アップ・弾が貫通」の状態で動かす
const EVO_LV=5,EVO_DMG=1.45,EVO_AREA=1.3;
for(const id in EVO){
 const d=WEP[id],t0=d.tick,dr=d.draw;
 d.evn=EVO[id].n;
 d.tick=(p,w,dt)=>{
  if(!w.evo)return t0(p,w,dt);
  const l=w.lv,od=p.dmg,oa=p.area;w.lv=l+EVO_LV;p.dmg*=EVO_DMG;p.area*=EVO_AREA;G.evoNow=true;
  try{t0(p,w,dt)}finally{w.lv=l;p.dmg=od;p.area=oa;G.evoNow=false}
 };
 if(dr)d.draw=(p,w)=>{
  if(!w.evo)return dr(p,w);
  const l=w.lv,oa=p.area;w.lv=l+EVO_LV;p.area*=EVO_AREA;
  try{dr(p,w)}finally{w.lv=l;p.area=oa}
 };
}
function canEvolve(p,w){const e=EVO[w.id];return !!e&&!w.evo&&w.lv>=WEP[w.id].max&&((p.pl&&p.pl[e.ps])||0)>=EVO_NEED_PS}

 w.evo=true;G.flash=.7;G.shake=16;
 ringFx(p.x,p.y,520,'#ffe45a',.7,12);ringFx(p.x,p.y,320,'#ffffff',.5,8);spawnPt(p.x,p.y,'#ffe45a',50,1.6);sparks(p.x,p.y,'#fff',24);
 showBanner('★ 覚醒！ '+EVO[w.id].n+' ★','#ffe45a');
}

// ===== 戦闘の共通処理（当たり判定・ダメージ・ドロップ） =====
function nearestE(x,y,maxD){let best=null,bd=maxD?maxD*maxD:Infinity;for(const e of G.en){if(e.dead)continue;const d=d2(x,y,e.x,e.y);if(d<bd){bd=d;best=e}}return best}
function nearestWhere(x,y,maxD,f){let best=null,bd=maxD*maxD;for(const e of G.en){if(e.dead||!f(e))continue;const d=d2(x,y,e.x,e.y);if(d<bd){bd=d;best=e}}return best}
function onScreen(e,m){m=m||0;return Math.abs(e.x-G.p.x)<W/2+m&&Math.abs(e.y-G.p.y)<H/2+m}
function addDn(x,y,v,col){if(G.dn.length>45)return;G.dn.push({x:x+rand(-8,8),y:y-10,v:typeof v==='number'?Math.round(v):v,life:.7,c:col||'#fff'})}

// 自分の弾
function addP(o){
 const b={x:o.x,y:o.y,vx:o.vx!=null?o.vx:Math.cos(o.a)*o.sp,vy:o.vy!=null?o.vy:Math.sin(o.a)*o.sp,r:o.r,dmg:o.dmg,pi:(o.pi||0)+(G.evoNow?4:0),col:o.col,kind:o.kind,life:o.life||2,kb:o.kb||0,grav:o.grav||0,hit:new Set(),t:0,dead:false};
 G.pr.push(b);return b;
}

// 範囲攻撃
function hitCircle(x,y,r,dmg,kb){for(const e of G.en){if(e.dead)continue;if(d2(x,y,e.x,e.y)<(r+e.r)**2)dmgE(e,dmg,kb,x,y)}}
function hitCircleCD(x,y,r,dmg,kb,key,cd){for(const e of G.en){if(e.dead)continue;if(d2(x,y,e.x,e.y)<(r+e.r)**2){const lt=e.hc[key];if(lt!=null&&G.t-lt<cd)continue;e.hc[key]=G.t;dmgE(e,dmg,kb,x,y)}}}
function hitSector(x,y,R,a,half,dmg,kb){for(const e of G.en){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d>R+e.r)continue;let da=Math.atan2(dy,dx)-a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;if(Math.abs(da)<=half+Math.atan2(e.r,Math.max(d,1)))dmgE(e,dmg,kb,x,y)}}
function beam(x,y,a,len,wid,dmg,col,noFx){
 const ca=Math.cos(a),sa=Math.sin(a);
 for(const e of G.en){if(e.dead)continue;const rx=e.x-x,ry=e.y-y,pr=rx*ca+ry*sa,pp=Math.abs(-rx*sa+ry*ca);if(pr>-e.r&&pr<len+e.r&&pp<wid+e.r)dmgE(e,dmg,50,x,y)}
 if(!noFx)G.fx.push({k:'laser',x1:x,y1:y,x2:x+ca*len,y2:y+sa*len,w:wid,life:.2,max:.2,c:col});
}

// 敵へのダメージ
function dmgE(e,dmg,kb,sx,sy){
 if(e.dead)return;
 e.hp-=dmg;e.flash=.08;hitFx(e,dmg,sx!=null?sx:G.p.x,sy!=null?sy:G.p.y);
 addDn(e.x,e.y-e.r,dmg,dmg>=G.p.dmg*4?'#ffd84a':'#ffffff');
 if(kb&&!e.boss){const res=e.t.kbRes||0;if(res<1){const ox=sx!=null?sx:G.p.x,oy=sy!=null?sy:G.p.y,dx=e.x-ox,dy=e.y-oy,d=Math.hypot(dx,dy)||1,f=kb*(1-res)*(e.giant||e.mid?.3:1);e.kx+=dx/d*f;e.ky+=dy/d*f}}
 if(e.hp<=0)killE(e);
}
function killE(e,noDrop){
 if(e.dead)return;e.dead=true;
 deathFx(e);
 if(noDrop)return;
 G.kills++;
 const p=G.p;
 if(e.boss){
  G.boss=null;G.shake=24;G.flash=.6;
  for(const o of G.en)if(!o.dead&&o!==e){spawnPt(o.x,o.y,'#ffffff',4,.4);o.dead=true}
  G.ep=[];for(const o of G.or)o.mag=true;
  G.pend=2.2;showBanner('BOSS撃破！','#ffd84a');return;
 }
 const big=e.elite||e.giant||e.mid;
 p.sg=Math.min(100,p.sg+(big?12:1)*p.ch.sg*p.sgMul);
 dropGem(e.x,e.y,e.xp);
 if(chance(big?1:.16))dropGold(e.x,e.y,big?6+G.si*3:1+Math.floor(G.si/2));
 if(e.giant||e.mid||(e.elite&&chance(.6)))addItem('chest',e.x+rand(-10,10),e.y+rand(-10,10));
 rollItem(e.x,e.y,big?8:1);
 if(e.t.split)for(let i=0;i<e.t.splitN;i++){const ne=makeEnemy(e.t.split,e.x+rand(-20,20),e.y+rand(-20,20));if(ne){ne.kx=rand(-220,220);ne.ky=rand(-220,220)}}
}

// 自分へのダメージ
function hurtP(dmg){
 const p=G.p;if(p.inv>0||p.star>0||isSkill(p,'whirl')||isSkill(p,'sanct'))return;
 const v=Math.max(1,dmg-p.armor);p.hp-=v;p.inv=.6;p.hf=.2;G.rf=.35;G.shake=Math.min(14,G.shake+6);
 spawnPt(p.x,p.y,'#ff5566',8,.5);addDn(p.x,p.y-34,v,'#ff5a6a');
}

// ドロップ
function dropGem(x,y,v){
 if(G.or.length>=300){const o=pick(G.or);if(o.kind==='xp'){o.v+=v;return}}
 G.or.push({kind:'xp',x,y,v,vx:rand(-60,60),vy:rand(-60,60),mag:false});
}
function dropGold(x,y,v){G.or.push({kind:'gold',x,y,v,vx:rand(-90,90),vy:rand(-90,90),mag:false})}
function addItem(k,x,y){if(G.items.length>=40&&k!=='chest')return;G.items.push({k,x,y,t:Math.random()*6,mag:false})}
function rollItem(x,y,m){let r=Math.random();for(const[k,pr]of ITEM_RATE){r-=pr*m;if(r<0){addItem(k,x,y);return}}}

function applyItem(k){
 const p=G.p;
 switch(k){
  case 'food':p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.3);break;
  case 'magnet':for(const o of G.or)o.mag=true;for(const it of G.items)if(it.k!=='magnet')it.mag=true;G.flash=.15;break;
  case 'bomb':G.flash=.5;G.shake=20;G.fx.push({k:'ring',x:p.x,y:p.y,r:700,life:.45,max:.45,c:'#ffffff'});
   for(const e of G.en){if(e.dead||!onScreen(e,60))continue;dmgE(e,e.boss?e.maxHp*.04:(e.giant||e.mid)?e.maxHp*.3:e.hp+1,0)}break;
  case 'clock':G.freeze=6;G.ep=[];break;
  case 'star':p.star=6;break;
  case 'orb':p.sg=Math.min(100,p.sg+35);break;
  case 'chest':openChest();return;
 }
 addDn(p.x,p.y-56,ITEMS[k].n,'#ffe08a');
}
function openChest(){
 const p=G.p;const ev=p.weapons.find(w=>canEvolve(p,w));
 if(ev){evolveWeapon(p,ev);G.goldRun+=30+G.si*10;return}
 const n=chance(.15)?3:1,got=[];
 for(let i=0;i<n;i++){const c=p.weapons.filter(w=>w.lv<WEP[w.id].max);if(!c.length)break;const w=pick(c);w.lv++;got.push(`${WEP[w.id].n} Lv${w.lv}`)}
 const g=20+G.si*10;G.goldRun+=g;
 if(!got.length)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.3);
 showBanner(got.length?'宝箱！ '+got.join(' / '):`宝箱！ +${g}G`,'#ffd84a');
}

// ---- js/game/spawn.js ----
// ===== 敵の出現 =====
// o: {elite 強化個体 / giant 巨大個体 / mid 中ボス / ai:'straight' 群れ}
function makeEnemy(type,x,y,o){
 o=o||{};const t=ET[type];if(!t)return null;
 const sc=G.sc,prog=Math.min(1,G.t/G.stage.dur);
 let hp=t.boss?t.hp:t.hp*sc.hpM*(1+prog*sc.grow),size=t.boss?t.sc:t.sc*sc.scM,dmg=t.dmg*sc.dmgM,xp=t.xp*sc.xpM,sp=t.sp;
 const e={id:nextId++,type,t,pal:t.pal,spr:t.spr,x,y,ai:o.ai||t.ai,flash:0,dead:false,kx:0,ky:0,hc:{},st:rand(.8,2.5),face:1,bob:Math.random()*6,cs:0,z:0,
  elite:false,giant:false,mid:false,boss:!!t.boss};
 if(t.boss){e.pats=t.pats;e.pi=0;e.atk=2.5;e.mode=null}
 if(o.mid){e.mid=true;hp=Math.min(hp*14,500*(1+G.si*.7));size*=1.9;dmg*=1.4;xp*=10;sp*=.85}
 else if(o.giant){e.giant=true;hp*=9;size*=1.75;dmg*=1.35;xp*=8;sp*=.8}
 else if(o.elite){e.elite=true;hp*=4;size*=1.35;dmg*=1.25;xp*=4;sp*=1.05}
 if(e.ai==='straight'){e.vx=o.vx;e.vy=o.vy;e.life=o.life||10}
 e.hp=e.maxHp=hp;e.sc=size;e.dmg=dmg;e.xp=xp;e.sp=sp;
 const s=SPRITES[t.spr];e.k=t.oh*1.15/s.h;e.r=Math.max(s.w*.8,s.h)*size*e.k*.34;
 G.en.push(e);return e;
}
function pickType(){
 let tot=0;const c=[];
 for(const[st,ty,w]of G.stage.pool)if(G.t>=st){tot+=w;c.push([ty,w])}
 let r=Math.random()*tot;for(const[ty,w]of c){r-=w;if(r<=0)return ty}
 return c[0][0];
}
function spawnPos(dist){const a=Math.random()*TAU,d=dist||rand(760,840);return[G.p.x+Math.cos(a)*d,G.p.y+Math.sin(a)*d]}
function spawnOne(){
 const sc=G.sc,r=Math.random(),o={},prog=Math.min(1,G.t/G.stage.dur);
 if(r<sc.giantP*(.5+prog))o.giant=true;
 else if(r<sc.giantP+sc.eliteP*(1+prog))o.elite=true;
 const[x,y]=spawnPos();makeEnemy(pickType(),x,y,o);
}
function updateSpawn(dt){
 if(G.pend>0)return;
 const stg=G.stage,prog=Math.min(1,G.t/stg.dur);
 while(G.evIdx<stg.events.length&&G.t>=stg.events[G.evIdx][0]){runEvent(stg.events[G.evIdx]);G.evIdx++}
 if(!G.midSpawned&&G.t>=stg.dur*.5){G.midSpawned=true;const[x,y]=spawnPos();makeEnemy(stg.pool[stg.pool.length-1][1],x,y,{mid:true});showBanner('強敵出現！','#ff8a5a')}
 if(!G.bossSpawned&&G.t>=stg.dur)spawnBoss();
 let target=Math.min(150,26+prog*(78+G.si*9));if(G.boss)target*=.45;
 G.spawnT-=dt;
 if(G.spawnT<=0){
  G.spawnT=Math.max(.08,.4-prog*(.28+G.si*.02));
  const alive=G.en.length;
  if(alive<target){const n=alive<target*.5?5:2+Math.floor(prog*2);for(let i=0;i<n;i++)spawnOne()}
 }
}
function runEvent(ev){
 const kind=ev[1],ty=ev[2],n=ev[3];
 if(kind==='swarm'){
  const a=Math.random()*TAU,cx=G.p.x+Math.cos(a)*820,cy=G.p.y+Math.sin(a)*820,ang=a+Math.PI,sp=ET[ty].sp*1.4+90;
  for(let i=0;i<n;i++)makeEnemy(ty,cx+rand(-130,130),cy+rand(-130,130),{ai:'straight',vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:11});
  showBanner('群れが来る！','#ffb05a');
 }else if(kind==='ring'){
  for(let i=0;i<n;i++){const a=i/n*TAU;makeEnemy(ty,G.p.x+Math.cos(a)*560,G.p.y+Math.sin(a)*560)}
  showBanner('包囲された！','#ff6a6a');
 }
}
function spawnBoss(){
 G.bossSpawned=true;const[x,y]=spawnPos(700);const b=makeEnemy(G.stage.boss,x,y);
 G.boss=b;G.shake=20;showBanner('BOSS: '+b.t.n,'#ff4a6a');
}

// ---- js/game/enemy.js ----
// ===== 敵の動き =====
function eShoot(e,a,sp,col,r,dm){G.ep.push({x:e.x,y:e.y-(e.z||0),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:r||7,dmg:e.dmg*(dm||.6),life:4.5,c:col})}

function updateEnemies(dt){
 const p=G.p,frz=G.freeze>0,slow=isSkill(p,'storm')?.5:1,damp=Math.max(0,1-dt*7);
 for(const e of G.en){
  if(e.dead)continue;
  e.flash=Math.max(0,e.flash-dt);
  e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=damp;e.ky*=damp;
  if(e.ai==='straight'){
   if(!frz){e.x+=e.vx*dt*slow;e.y+=e.vy*dt*slow}
   e.face=e.vx<0?-1:1;e.life-=dt;if(e.life<=0){killE(e,true);continue}
  }
  if(frz)continue;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,sp=e.sp*slow;
  if(e.ai!=='straight'&&Math.abs(dx)>3)e.face=dx<0?-1:1;
  if(e.boss)bossAI(e,dt,ux,uy,d,slow);
  else switch(e.ai){
   case 'chase':case 'ghost':e.x+=ux*sp*dt;e.y+=uy*sp*dt;break;
   case 'wave':{const w=Math.sin(G.t*4+e.id)*.9;e.x+=(ux-uy*w)*sp*dt;e.y+=(uy+ux*w)*sp*dt;break}
   case 'charge':
    if(e.cs===0){e.x+=ux*sp*dt;e.y+=uy*sp*dt;e.st-=dt;if(d<340&&e.st<=0){e.cs=1;e.ct=.55}}
    else if(e.cs===1){e.ct-=dt;e.flash=Math.sin(G.t*40)>0?.05:0;if(e.ct<=0){e.cs=2;e.ct=.6;e.vx=ux*sp*4.2;e.vy=uy*sp*4.2}}
    else{e.x+=e.vx*dt;e.y+=e.vy*dt;e.ct-=dt;if(e.ct<=0){e.cs=0;e.st=rand(1.8,2.8)}}
    break;
   case 'ranged':case 'summon':{
    const ideal=e.ai==='summon'?330:270;let m=0;if(d>ideal+50)m=1;else if(d<ideal-50)m=-1;
    const sd=(e.id%2?1:-1)*.5;e.x+=(ux*m-uy*sd)*sp*dt;e.y+=(uy*m+ux*sd)*sp*dt;e.st-=dt;
    if(e.st<=0&&d<650){
     e.st=(e.t.rate||2.2)*rand(.85,1.15);
     if(e.ai==='summon'){if(G.en.length<130)for(let i=0;i<2+(e.elite?2:0);i++)makeEnemy(e.t.summon,e.x+rand(-50,50),e.y+rand(-50,50));spawnPt(e.x,e.y,'#c87aff',10,.6)}
     else{const a=Math.atan2(dy,dx),bc=e.t.bc,bs=e.t.bsp;
      if(e.t.shot==='spread3'){for(let k=-1;k<=1;k++)eShoot(e,a+k*.25,bs,bc)}else eShoot(e,a,bs,bc);
      if(e.elite||e.giant||e.mid){eShoot(e,a+.15,bs,bc);eShoot(e,a-.15,bs,bc)}}
    }
    break}
   case 'turret':
    e.x+=ux*sp*dt;e.y+=uy*sp*dt;e.st-=dt;
    if(e.st<=0&&d<700){e.st=e.t.rate*rand(.85,1.15);const n=8,o=Math.random();for(let i=0;i<n;i++)eShoot(e,o+i/n*TAU,e.t.bsp,e.t.bc)}
    break;
   case 'bomber':
    if(e.fuse==null){e.x+=ux*sp*dt;e.y+=uy*sp*dt;if(d<e.r+70)e.fuse=.6}
    else{e.fuse-=dt;e.flash=Math.sin(G.t*50)>0?.05:0;
     if(e.fuse<=0){G.fx.push({k:'boom',x:e.x,y:e.y,r:110,life:.35,max:.35,c:'#ff8a3a'});G.shake=Math.min(16,G.shake+6);
      if(d2(e.x,e.y,p.x,p.y)<(110+p.r)**2)hurtP(e.dmg);killE(e,true);continue}}
    break;
  }
  // 体当たり
  if(!e.dead&&e.ai!=='bomber'&&(e.z||0)<30&&d<e.r+p.r*.9)hurtP(e.dmg);
  // 遠くに離れた敵は前方へ回り込ませる
  if(!e.boss&&e.ai!=='straight'&&d>1150){const a=Math.atan2(p.diry,p.dirx)+rand(-.9,.9);e.x=p.x+Math.cos(a)*790;e.y=p.y+Math.sin(a)*790;e.cs=0;e.fuse=null}
 }
 // 敵同士の押し合い
 const en=G.en,n=en.length;
 for(let i=0;i<n;i++){const a=en[i];if(a.dead||a.ai==='ghost'||a.ai==='straight')continue;
  for(let j=i+1;j<n;j++){const b=en[j];if(b.dead||b.ai==='ghost'||b.ai==='straight')continue;
   const dx=b.x-a.x,dy=b.y-a.y,md=(a.r+b.r)*.8;if(dx>md||dx<-md||dy>md||dy<-md)continue;
   const dd=dx*dx+dy*dy;if(dd>=md*md)continue;const d=Math.sqrt(dd)||.01,push=(md-d)*.5,nx=dx/d,ny=dy/d;
   if(a.boss){b.x+=nx*push*2;b.y+=ny*push*2}else if(b.boss){a.x-=nx*push*2;a.y-=ny*push*2}
   else{a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}}}
 G.en=G.en.filter(e=>!e.dead);
}

// ===== ボスの行動 =====
function bossAI(e,dt,ux,uy,d,slow){
 const p=G.p,bc=e.t.bc,lv=G.si;
 if(e.mode){
  e.mt-=dt;
  if(e.mode==='windup'){e.flash=Math.sin(G.t*40)>0?.05:0;if(e.mt<=0){e.mode='dash';e.mt=.75;const a=Math.atan2(p.y-e.y,p.x-e.x);e.vx=Math.cos(a)*560;e.vy=Math.sin(a)*560}}
  else if(e.mode==='dash'){e.x+=e.vx*dt*slow;e.y+=e.vy*dt*slow;if(chance(dt*18))eShoot(e,Math.atan2(e.vy,e.vx)+Math.PI+rand(-.6,.6),120,bc,7,.4);if(e.mt<=0)e.mode=null}
  else if(e.mode==='spiral'){e.sa+=dt*2.6;e.sT-=dt;if(e.sT<=0){e.sT=.1;for(let k=0;k<3;k++)eShoot(e,e.sa+k*TAU/3,210,bc,8,.45)}if(e.mt<=0)e.mode=null}
  else if(e.mode==='jump'){
   const pr=1-Math.max(0,e.mt)/e.jd;e.x=e.jx0+(e.jx1-e.jx0)*pr;e.y=e.jy0+(e.jy1-e.jy0)*pr;e.z=Math.sin(pr*Math.PI)*160;
   if(e.mt<=0){e.z=0;e.mode=null;G.shake=18;G.fx.push({k:'ring',x:e.x,y:e.y,r:200,life:.4,max:.4,c:bc});
    if(d2(e.x,e.y,p.x,p.y)<(e.r+90)**2)hurtP(e.dmg*1.2);const n=12+lv*2;for(let i=0;i<n;i++)eShoot(e,i/n*TAU,190,bc,8,.45)}
  }
  return;
 }
 const sp=e.sp*slow;
 if(d>200){e.x+=ux*sp*dt;e.y+=uy*sp*dt}else{e.x+=-uy*sp*.6*dt;e.y+=ux*sp*.6*dt}
 e.atk-=dt;
 if(e.atk<=0){
  e.atk=Math.max(1.3,2.5-lv*.15);const pat=e.pats[e.pi++%e.pats.length],a=Math.atan2(p.y-e.y,p.x-e.x);
  switch(pat){
   case 'ring':{const n=14+lv*2,o=Math.random();for(let i=0;i<n;i++)eShoot(e,o+i/n*TAU,200,bc,8,.45);break}
   case 'aim3':{const n=3+Math.floor(lv/2)*2;for(let k=0;k<n;k++)eShoot(e,a+(k-(n-1)/2)*.2,320,bc,7,.5);break}
   case 'summon':{if(G.en.length<130){const n=4+lv;for(let i=0;i<n;i++){const aa=i/n*TAU;makeEnemy(e.t.summon,e.x+Math.cos(aa)*90,e.y+Math.sin(aa)*90)}}break}
   case 'dash':e.mode='windup';e.mt=.6;break;
   case 'spiral':e.mode='spiral';e.mt=2.2;e.sa=a;e.sT=0;break;
   case 'jump':e.mode='jump';e.jd=e.mt=.9;e.jx0=e.x;e.jy0=e.y;e.jx1=p.x;e.jy1=p.y;break;
  }
 }
}

// ---- js/game/skills.js ----
// ===== 固有スキル（敵を倒すとゲージが溜まり、満タンで発動） =====
function useSkill(){
 const p=G.p;if(!p||ST!=='playing'||p.sg<100||p.skill)return;
 p.sg=0;const id=p.ch.skill.id,sk={id,t:0,dur:1,tick:0};
 switch(id){
  case 'overdrive':sk.dur=6;for(const w of p.weapons)w.t=0;break;
  case 'whirl':sk.dur=4;break;
  case 'sanct':sk.dur=6;p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.4);hitCircle(p.x,p.y,320,pD(p)*6,520);G.fx.push({k:'ring',x:p.x,y:p.y,r:320,life:.5,max:.5,c:'#c8e0ff'});break;
  case 'judge':sk.dur=1.8;sk.a=p.ang||0;break;
  case 'storm':sk.dur=4;break;
  case 'legion':sk.dur=10;break;
 }
 p.skill=sk;G.shake=10;G.flash=.25;
 showBanner(p.ch.skill.n+'！',p.ch.c);
}
function updateSkill(p,dt){
 const s=p.skill;if(!s)return;
 s.t+=dt;s.tick-=dt;
 if(s.id==='whirl'){s.a=(s.a||0)+dt*14;if(s.tick<=0){s.tick=.12;hitCircle(p.x,p.y,170*p.area,pD(p)*1.7,200)}}
 else if(s.id==='judge'){s.a+=dt*TAU/1.6;if(s.tick<=0){s.tick=.06;beam(p.x,p.y-6,s.a,950,42,pD(p)*3,'#9af0ff',true)}}
 else if(s.id==='storm'){if(s.tick<=0){s.tick=.09;const cs=G.en.filter(e=>!e.dead&&onScreen(e));if(cs.length){const e=pick(cs);hitCircle(e.x,e.y,50,pD(p)*4,80);G.fx.push({k:'bolt',x:e.x,y:e.y,life:.25,max:.25});spawnPt(e.x,e.y,'#ffe45a',6,.5)}}}
 if(s.t>=s.dur)p.skill=null;
}

// ---- js/game/update.js ----
// ===== ゲームの進行（開始・毎フレームの更新） =====
const xpNeed=l=>Math.round(4+l*3.2+Math.pow(l,1.6)*.6);

function startStage(si,cid){
 resetG();
 const ch=CHARS[cid];
 G.si=si;G.stage=STAGES[si];G.sc=stScale(si);
 const maxHp=Math.round(ch.hp+permV('hp'));
 G.p={cid,ch,x:0,y:0,r:16,hp:maxHp,maxHp,sp:ch.sp*(1+permV('speed')),dmg:ch.dmg*(1+permV('damage')),
  cdMul:1-Math.min(.4,permV('cooldown')),area:1,pr:95*(1+permV('magnet')),greed:1+permV('greed'),armor:0,regen:0,sgMul:1,
  level:1,xp:0,xpNext:xpNeed(1),inv:1.5,hf:0,star:0,sg:0,skill:null,face:1,dirx:1,diry:0,ang:0,moving:false,
  weapons:[{id:ch.wep,lv:1,t:0,a:0}],pl:{}};
 S.lastChar=cid;saveNow();
 ST='playing';ui.innerHTML='';hud.classList.add('on');updateSkillBtn(true);LMT=performance.now();
 showBanner(`STAGE ${si+1}  ${G.stage.n}`,'#cfe0ff');
}

function update(dt){
 const p=G.p;if(!p)return;
 G.t+=dt;G.anim+=dt;
 G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt);G.rf=Math.max(0,(G.rf||0)-dt);G.freeze=Math.max(0,G.freeze-dt);
 updatePlayer(dt);
 for(const w of p.weapons)WEP[w.id].tick(p,w,dt);
 updateSkill(p,dt);
 updateSpawn(dt);updateEnemies(dt);updateProj(dt);updateEProj(dt);updateZones(dt);updateOrbs(dt);updateItems(dt);
 for(const f of G.fx)f.life-=dt;G.fx=G.fx.filter(f=>f.life>0);
 for(const q of G.pt){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=q.fr;q.vy*=q.fr;q.vy+=q.grav*dt}G.pt=G.pt.filter(q=>q.life>0);
 for(const n of G.dn){n.life-=dt;n.y-=40*dt}G.dn=G.dn.filter(n=>n.life>0);
 if(G.pend>0){G.pend-=dt;if(G.pend<=0){finishRun(true);return}}
 if(p.hp<=0){p.hp=0;finishRun(false);return}
 if(p.xp>=p.xpNext&&G.pend<=0)levelUp();
}

function updatePlayer(dt){
 const p=G.p;let mx=0,my=0;
 if(K.w||K.arrowup)my-=1;if(K.s||K.arrowdown)my+=1;if(K.a||K.arrowleft)mx-=1;if(K.d||K.arrowright)mx+=1;
 const ml=Math.hypot(mx,my);
 if(ml>0){mx/=ml;my/=ml}else if(G.tv){mx=G.tv.x;my=G.tv.y;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}}
 const mv=Math.hypot(mx,my);p.moving=mv>.1;
 if(p.moving){p.dirx=mx/mv;p.diry=my/mv;if(Math.abs(mx)>.15)p.face=mx<0?-1:1}
 const spd=p.sp*(isSkill(p,'whirl')?1.3:1)*(p.star>0?1.25:1);
 p.x+=mx*spd*dt;p.y+=my*spd*dt;
 p.inv=Math.max(0,p.inv-dt);p.hf=Math.max(0,p.hf-dt);p.star=Math.max(0,p.star-dt);
 if(p.regen>0)p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);
 const t=nearestE(p.x,p.y,700);if(t){p.ang=Math.atan2(t.y-p.y,t.x-p.x);if(!p.moving)p.face=t.x<p.x?-1:1}
 if(p.star>0)hitCircleCD(p.x,p.y,p.r+14,p.dmg*3,300,'star',.3);
 G.cam.x=p.x-W/2;G.cam.y=p.y-H/2;
}

function updateProj(dt){
 for(const b of G.pr){
  if(b.dead)continue;b.life-=dt;b.t+=dt;
  if(b.kind==='homing'||b.kind==='missile'){
   const t=nearestE(b.x,b.y,700);
   if(t){const des=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx);let df=des-cur;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;
    const na=cur+clamp(df,-7*dt,7*dt),sp=Math.min(Math.hypot(b.vx,b.vy)+700*dt,820);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp}
  }else if(b.kind==='axe')b.vy+=b.grav*dt;
  else if(b.kind==='boomerang'&&b.t>.45){
   if(!b.ret){b.ret=true;b.hit.clear()}
   const dx=G.p.x-b.x,dy=G.p.y-b.y,d=Math.hypot(dx,dy)||1;b.vx+=dx/d*2200*dt;b.vy+=dy/d*2200*dt;
   const sp=Math.hypot(b.vx,b.vy);if(sp>640){b.vx=b.vx/sp*640;b.vy=b.vy/sp*640}
   if(d<30){b.dead=true;continue}
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.kind!=='pellet'){const tr=b.tr||(b.tr=[]);tr.push(b.x,b.y);if(tr.length>(b.kind==='knife'?10:16))tr.splice(0,2)}
  if(b.life<=0){b.dead=true;continue}
  for(const e of G.en){
   if(e.dead||b.hit.has(e.id))continue;const rr=e.r+b.r;
   if(d2(e.x,e.y,b.x,b.y)<rr*rr){dmgE(e,b.dmg,b.kb,b.x-b.vx*.02,b.y-b.vy*.02);b.hit.add(e.id);if(b.pi>0)b.pi--;else{b.dead=true;spawnPt(b.x,b.y,b.col,3,.3);break}}
  }
 }
 G.pr=G.pr.filter(b=>!b.dead);
}
function updateEProj(dt){
 const p=G.p,frz=G.freeze>0;
 for(const b of G.ep){
  if(!frz){b.x+=b.vx*dt;b.y+=b.vy*dt}b.life-=dt;
  if(b.life<=0){b.dead=true;continue}
  if(d2(b.x,b.y,p.x,p.y)<(p.r*.7+b.r)**2){hurtP(b.dmg);b.dead=true}
 }
 G.ep=G.ep.filter(b=>!b.dead);
}
function updateZones(dt){for(const z of G.zones){z.life-=dt;hitCircleCD(z.x,z.y,z.r,z.dmg,0,'hz',.3)}G.zones=G.zones.filter(z=>z.life>0)}
function updateOrbs(dt){
 const p=G.p,pr2=p.pr*p.pr;
 for(const o of G.or){
  const dx=p.x-o.x,dy=p.y-o.y,dd=dx*dx+dy*dy;
  if(o.mag||dd<pr2){const d=Math.sqrt(dd)||1,sp=o.mag?950:640;o.vx=dx/d*sp;o.vy=dy/d*sp}else{o.vx*=.9;o.vy*=.9}
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  if(dd<(p.r+14)**2){if(o.kind==='xp')p.xp+=o.v;else G.goldRun+=Math.max(1,Math.round(o.v*p.greed));o.dead=true}
 }
 G.or=G.or.filter(o=>!o.dead);
}
function updateItems(dt){
 const p=G.p;
 for(const it of G.items){
  if(it.dead)continue;it.t+=dt;
  const dx=p.x-it.x,dy=p.y-it.y,dd=dx*dx+dy*dy;
  if(it.mag){const d=Math.sqrt(dd)||1;it.x+=dx/d*850*dt;it.y+=dy/d*850*dt}
  if(dd<(p.r+26)**2){it.dead=true;applyItem(it.k)}
 }
 G.items=G.items.filter(i=>!i.dead);
}

function drawZones(){

  ctx.globalAlpha=.28*a;ctx.fillStyle='#2a7ad8';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.fill();
  ctx.globalAlpha=.55*a;ctx.strokeStyle='#bfe4ff';ctx.lineWidth=3;ctx.setLineDash([14,10]);ctx.lineDashOffset=-t*40;ctx.beginPath();ctx.arc(z.x,z.y,z.r*.96,0,TAU);ctx.stroke();ctx.setLineDash([]);
  additive(true);
  for(let i=0;i<3;i++){const ph=((t*.9+i/3)%1);ctx.globalAlpha=.5*a*(1-ph);ctx.strokeStyle='#7ac8ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(z.x,z.y,z.r*ph,0,TAU);ctx.stroke()}
  for(let i=0;i<5;i++){const ph=((t*.7+i*.21)%1),ang=i*2.4+z.x;glow(z.x+Math.cos(ang)*z.r*.7*(i%2?.6:1),z.y+Math.sin(ang)*z.r*.5-ph*40,10,'#9ad8ff',.8*a*(1-ph))}
  additive(false);
 }

}
function drawProj(){

   for(let i=2;i<tr.length;i+=2){const k=i/tr.length;ctx.globalAlpha=.55*k;ctx.strokeStyle=b.col;ctx.lineWidth=Math.max(2,b.r*1.5*k);ctx.beginPath();ctx.moveTo(tr[i-2],tr[i-1]);ctx.lineTo(tr[i],tr[i+1]);ctx.stroke()}
   ctx.lineCap='butt';additive(false)}
  switch(b.kind){
   case 'bolt':additive(true);glow(b.x,b.y,b.r*4.2,b.col,.9);ctx.globalAlpha=1;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,15,4.5,0,0,TAU);ctx.fill();ctx.restore();additive(false);break;
   case 'knife':ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.fillStyle='#8a5a2a';ctx.fillRect(-14,-2.5,9,5);ctx.fillStyle='#ffd84a';ctx.fillRect(-6,-4,3,8);
    ctx.fillStyle='#f4f8ff';ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(16,0);ctx.lineTo(-3,4);ctx.closePath();ctx.fill();ctx.fillStyle='#9ab0d8';ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(16,0);ctx.lineTo(-3,4);ctx.fill();ctx.restore();
    additive(true);glow(b.x+Math.cos(a)*8,b.y+Math.sin(a)*8,16,'#bcd0ff',.5);additive(false);break;
   case 'axe':{const s=b.r;additive(true);glow(b.x,b.y,s*2.4,'#ff7a3a',.55);additive(false);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.t*12);
    ctx.fillStyle='#6a4a2a';ctx.fillRect(-2.5,-s*1.1,5,s*2.2);ctx.fillStyle='#0b0b14';ctx.beginPath();ctx.moveTo(1,-s*1.15);ctx.quadraticCurveTo(s*1.5,-s*.9,s*1.2,s*.2);ctx.lineTo(1,-s*.1);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d8dce8';ctx.beginPath();ctx.moveTo(2,-s);ctx.quadraticCurveTo(s*1.3,-s*.8,s*1.05,s*.1);ctx.lineTo(2,-s*.2);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(3,-s*.8,3,s*.5);ctx.restore();break}
   case 'boomerang':additive(true);glow(b.x,b.y,b.r*3,'#ffb030',.6);additive(false);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.t*15);
    ctx.strokeStyle='#0b0b14';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,b.r,.2,Math.PI*1.35);ctx.stroke();ctx.strokeStyle='#ffc04a';ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle='#fff2b0';ctx.lineWidth=2.5;ctx.stroke();ctx.lineCap='butt';ctx.restore();break;
   case 'homing':case 'missile':additive(true);glow(b.x-Math.cos(a)*8,b.y-Math.sin(a)*8,16,'#ff9a3a',.8);glow(b.x,b.y,b.r*3,b.col,.8);additive(false);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.fillStyle='#0b0b14';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-8,-7);ctx.lineTo(-4,0);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();
    ctx.fillStyle=b.col;ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-6,-5);ctx.lineTo(-3,0);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(0,-1.5,8,3);ctx.restore();break;
   default:additive(true);glow(b.x,b.y,b.r*3.4,b.col,.85);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.6,0,TAU);ctx.fill();additive(false);

function drawEProj(){
 additive(true);
 for(const b of G.ep){glow(b.x,b.y,b.r*3.3,b.c,.85);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.55,0,TAU);ctx.fill()}
 additive(false);ctx.globalAlpha=1;
}
function drawFx(){
 for(const f of G.fx){
  const a=Math.max(0,f.life/f.max),inv=1-a;ctx.globalAlpha=a;
  switch(f.k){
   case 'arc':{ // 三日月の斬撃
    additive(true);const R=f.r,r2=R*.45,aa=f.a,w=f.w*(1.05-a*.2),sw=aa-w+inv*w*.5;
    ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,R,aa-w,aa+w);ctx.arc(f.x-Math.cos(aa)*R*.28,f.y-Math.sin(aa)*R*.28,R*.82,aa+w,aa-w,true);ctx.closePath();ctx.fill();
    ctx.globalAlpha=Math.min(1,a*1.6);ctx.strokeStyle='#fff';ctx.lineWidth=7*a+2;ctx.lineCap='round';ctx.beginPath();ctx.arc(f.x,f.y,R*.97,aa-w*.95,aa+w*.95);ctx.stroke();ctx.lineCap='butt';
    ctx.globalAlpha=a;glow(f.x+Math.cos(aa)*R*.9,f.y+Math.sin(aa)*R*.9,R*.4,f.c,.7);additive(false);break}
   case 'laser':{additive(true);const w=f.w*(.5+a*.7);ctx.lineCap='round';
    ctx.globalAlpha=a*.5;ctx.strokeStyle=f.c;ctx.lineWidth=w*3.2;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();
    ctx.globalAlpha=a*.9;ctx.lineWidth=w*1.6;ctx.stroke();ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(3,w*.7);ctx.stroke();ctx.lineCap='butt';
    glow(f.x1,f.y1,w*3,f.c,a);additive(false);break}
   case 'zap':{additive(true);const n=7;const pts=[[f.x1,f.y1]];for(let i=1;i<n;i++){const t=i/n;pts.push([f.x1+(f.x2-f.x1)*t+rand(-14,14),f.y1+(f.y2-f.y1)*t+rand(-14,14)])}pts.push([f.x2,f.y2]);
    for(const[w,c,al]of[[11,f.c,.4],[5,f.c,.9],[2,'#fff',1]]){ctx.globalAlpha=al*a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
    glow(f.x2,f.y2,34,f.c,a);additive(false);break}
   case 'bolt':{additive(true);let py=f.y-300,px=f.x+rand(-20,20);const pts=[[px,py]];while(py<f.y-10){py+=30;px+=rand(-22,22);pts.push([px,py])}pts.push([f.x,f.y]);
    for(const[w,c,al]of[[16,'#ffd84a',.35],[7,'#fff0a0',.9],[3,'#fff',1]]){ctx.globalAlpha=al*a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
    ctx.globalAlpha=a;glow(f.x,f.y,70*(1.2-a*.3),'#ffe45a',1);ctx.strokeStyle='#fff2a0';ctx.lineWidth=4;ctx.globalAlpha=a*.8;ctx.beginPath();ctx.ellipse(f.x,f.y,50*inv+14,20*inv+6,0,0,TAU);ctx.stroke();additive(false);break}
   case 'ring':additive(true);ctx.strokeStyle=f.c;ctx.lineWidth=(f.w||8)*a+1;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.15+inv*.85),0,TAU);ctx.stroke();ctx.globalAlpha=a*.4;ctx.lineWidth=(f.w||8)*a*2.5;ctx.stroke();additive(false);break;
   case 'boom':additive(true);glow(f.x,f.y,f.r*(1.4-a*.3),f.c,a);glow(f.x,f.y,f.r*.7*a+4,'#ffffff',a);additive(false);break;
   case 'hit':ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.beginPath();const L=(26+inv*18)*f.s;ctx.moveTo(-L,0);ctx.quadraticCurveTo(0,-5*f.s*a-1,L,0);ctx.quadraticCurveTo(0,5*f.s*a+1,-L,0);ctx.fill();ctx.restore();break;
  }
 }
 ctx.globalAlpha=1;
}
function drawParticles(){
 additive(true);ctx.lineCap='round';
 for(const q of G.pt){
  const a=Math.min(1,q.life/q.max*1.6);ctx.globalAlpha=a;
  if(q.ln){ctx.strokeStyle=q.c;ctx.lineWidth=q.r*a+.6;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.045,q.y-q.vy*.045);ctx.stroke()}
  else if(q.g){glow(q.x,q.y,q.r*3.2*(.5+a*.5),q.c,a)}
  else{ctx.fillStyle=q.c;ctx.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r)}
 }
 additive(false);ctx.lineCap='butt';ctx.globalAlpha=1;
}

// ===== レベルアップ =====
const PSMAX=5;
const PASSIVES=[
 {k:'dmg',n:'攻撃力',ic:'攻',b:.1,d:v=>`攻撃力 +${Math.round(v*100)}%`,f:(p,v)=>p.dmg*=1+v},
 {k:'cd',n:'攻撃速度',ic:'速',b:.06,d:v=>`攻撃の間隔 -${Math.round(v*100)}%`,f:(p,v)=>p.cdMul*=1-v},
 {k:'area',n:'攻撃範囲',ic:'広',b:.1,d:v=>`攻撃範囲 +${Math.round(v*100)}%`,f:(p,v)=>p.area*=1+v},
 {k:'sp',n:'移動速度',ic:'足',b:.08,d:v=>`移動速度 +${Math.round(v*100)}%`,f:(p,v)=>p.sp*=1+v},
 {k:'hp',n:'最大HP',ic:'命',b:20,d:v=>`最大HP +${Math.round(v)}`,f:(p,v)=>{p.maxHp+=Math.round(v);p.hp+=Math.round(v)}},
 {k:'pr',n:'回収範囲',ic:'磁',b:.25,d:v=>`回収範囲 +${Math.round(v*100)}%`,f:(p,v)=>p.pr*=1+v},
 {k:'armor',n:'防御',ic:'防',b:1,d:v=>`受けるダメージ -${Math.round(v)}`,f:(p,v)=>p.armor+=Math.round(v)},
 {k:'regen',n:'自然回復',ic:'再',b:.4,d:v=>`毎秒 ${v.toFixed(1)} HP回復`,f:(p,v)=>p.regen+=v},
 {k:'sg',n:'スキル充填',ic:'技',b:.15,d:v=>`ゲージの溜まり +${Math.round(v*100)}%`,f:(p,v)=>p.sgMul*=1+v},
];
const PSBYK={};for(const x of PASSIVES)PSBYK[x.k]=x;
const HEAL_CARD={n:'おにぎり',ic:'癒',d:'HPを40%回復'};

function levelUp(){
 const p=G.p;stickEnd();
 p.xp-=p.xpNext;p.level++;p.xpNext=xpNeed(p.level);
 ringFx(p.x,p.y,420,'#7fe8ff',.6,10);ringFx(p.x,p.y,260,'#ffffff',.45,6);spawnPt(p.x,p.y,'#9ae8ff',30,1.4);
 ST='levelup';hideBanner();showLevelUp();
}
function buildChoices(){
 const p=G.p,pool=[];p.pl=p.pl||{};
 // 覚醒できる武器があれば必ず候補に出す
 for(const w of p.weapons)if(canEvolve(p,w)){const d=WEP[w.id];pool.push({w:1000,kind:'evo',wp:w,d,title:EVO[w.id].n,desc:EVO[w.id].d,ic:d.ic,c:'#ffe45a',tag:'★ 覚醒 ★'})}
 for(const w of p.weapons){const d=WEP[w.id];if(w.lv<d.max)pool.push({w:d.main?4:3,kind:'wup',wp:w,d,title:`${d.n} Lv${w.lv+1}`,desc:d.lv(w.lv+1),ic:d.ic,c:d.c,tag:'UPGRADE'})}
 if(p.weapons.length<MAX_WEAPONS){const own=new Set(p.weapons.map(w=>w.id));
  for(const id of shuffle(SUBS.filter(i=>!own.has(i))).slice(0,3)){const d=WEP[id];pool.push({w:2.2,kind:'wnew',id,d,title:d.n,desc:d.d,ic:d.ic,c:d.c,tag:'NEW WEAPON'})}}
 for(const ps of PASSIVES){const cur=p.pl[ps.k]||0;if(cur>=PSMAX)continue;
  const mate=p.weapons.find(w=>EVO[w.id]&&EVO[w.id].ps===ps.k&&!w.evo);
  let desc=ps.d(ps.b);if(mate)desc+=`<br><span class="evh">${WEP[mate.id].n}の覚醒に必要</span>`;
  pool.push({w:(mate&&mate.lv>=WEP[mate.id].max-2?3.5:1.3)*(cur?1.4:1),kind:'stat',ps,v:ps.b,title:`${ps.n} Lv${cur+1}`,desc,ic:ps.ic,c:'#8ae0a0',tag:cur?`PASSIVE Lv${cur}→${cur+1}`:'PASSIVE'})}
 pool.push({w:.5,kind:'heal',title:HEAL_CARD.n,desc:HEAL_CARD.d,ic:HEAL_CARD.ic,c:'#ff9ac0',tag:'RECOVER'});
 const out=[];
 while(out.length<3&&pool.length){let tot=pool.reduce((s,o)=>s+o.w,0),r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0])}
 return out;
}
function showLevelUp(){
 const p=G.p,ch=buildChoices();
 ui.innerHTML=`<div class="s"><h2>LEVEL UP!  Lv ${p.level}</h2><div class="sub">強化を1つ選んでください</div><div class="cards">${ch.map((o,i)=>`
  <div class="card${o.kind==='evo'?' evo':''}" data-i="${i}" style="--c:${o.c}"><div class="cr">${o.tag}</div><div class="ci">${o.ic}</div><div class="cn">${o.title}</div><div class="cd">${o.desc}</div></div>`).join('')}</div></div>`;
 ui.querySelectorAll('.card').forEach(el=>{el.onclick=()=>{
  const o=ch[+el.dataset.i];
  if(o.kind==='wup')o.wp.lv++;else if(o.kind==='wnew')p.weapons.push({id:o.id,lv:1,t:0,a:0});
  else if(o.kind==='evo'){ui.innerHTML='';ST='playing';LMT=performance.now();evolveWeapon(p,o.wp);if(p.xp>=p.xpNext)levelUp();return}
  else if(o.kind==='heal')p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.4);
  else{p.pl[o.ps.k]=(p.pl[o.ps.k]||0)+1;o.ps.f(p,o.v)}
  if(p.xp>=p.xpNext){levelUp();return}
  ui.innerHTML='';ST='playing';LMT=performance.now();
 }});
}

 ui.innerHTML=`<div class="s"><h2>PAUSE</h2><div class="sub">STAGE ${G.si+1} ${G.stage.n} ・ 経過 ${fmtTime(G.t)} ・ Lv ${p.level}</div>
  <div class="wl">${p.weapons.map(w=>`<span style="--c:${WEP[w.id].c}">${WEP[w.id].n} Lv${w.lv}</span>`).join('')}</div>
  <div class="sub">スキル: ${p.ch.skill.n} … ${p.ch.skill.d}</div>
  <div class="row"><button class="btn big" id="bc">再開</button><button class="btn" id="bq">リタイア</button></div></div>`;
 document.getElementById('bc').onclick=resumeGame;
 document.getElementById('bq').onclick=()=>finishRun(false,true);
}
function resumeGame(){
 if(ST!=='paused')return;
 ST='playing';ui.innerHTML='';hud.classList.add('on');updateSkillBtn(true);LMT=performance.now();
}

// ---- js/screens/result.js ----
// ===== ステージの結果（クリア／ゲームオーバー） =====
// ステージはクリアごとに区切り。クリアすると次のステージが解放される
function finishRun(clear,retire){
 stickEnd();hideBanner();hud.classList.remove('on');
 const si=G.si,p=G.p;let bonus=0,msg='';
 if(clear){
  const first=!S.cleared[si];bonus=(100+si*80)*(first?2:1);S.cleared[si]=true;
  if(first&&si+1<STAGES.length)msg=`STAGE ${si+2}「${STAGES[si+1].n}」が解放されました！`;
  else if(first)msg='全ステージ制覇！おめでとう！';
 }
 const earned=G.goldRun+bonus;S.gold+=earned;
 const b=S.best[si]||{lv:0,kills:0};S.best[si]={lv:Math.max(b.lv,p.level),kills:Math.max(b.kills,G.kills)};
 saveNow();ST='result';
 ui.innerHTML=`<div class="s">${clear?'<h1 class="c">STAGE CLEAR!</h1>':`<h1 class="d">${retire?'RETIRE':'GAME OVER'}</h1>`}
  <div class="sub">STAGE ${si+1} ${G.stage.n}</div>
  <div class="stats"><div><span>経過</span><span>${fmtTime(G.t)}</span></div><div><span>撃破</span><span>${G.kills}</span></div><div><span>Lv</span><span>${p.level}</span></div>
   <div><span>拾ったゴールド</span><span>${G.goldRun}G</span></div>${clear?`<div><span>クリア報酬</span><span>+${bonus}G</span></div>`:''}</div>
  ${msg?`<div class="gold" style="font-size:2.2cqw">${msg}</div>`:''}
  <div class="sub">所持ゴールド ${S.gold} G</div>
  <div class="row"><button class="btn big" id="bn">ステージ選択へ</button>${clear?'':'<button class="btn" id="br">もう一度</button>'}<button class="btn" id="bh">タイトル</button></div></div>`;
 document.getElementById('bn').onclick=showStages;
 document.getElementById('bh').onclick=showTitle;
 const br=document.getElementById('br');if(br)br.onclick=()=>startStage(si,p.cid);
}

// ---- js/screens/gacha.js ----
// ===== ガチャ（恒久強化・キャラ解放） =====
const GACHA_COST=150;
function showGacha(){
 ST='gacha';
 ui.innerHTML=`<div class="s"><h2>GACHA</h2><div class="gold" id="gg">${S.gold} G</div>
  <div class="row"><button class="btn g" id="bp">1回引く (${GACHA_COST}G)</button><button class="btn" id="bb">戻る</button></div>
  <div class="gr" id="res"><div class="sub">恒久強化・新キャラを入手</div></div>
  <div class="sub" id="pm"></div></div>`;
 const refresh=()=>{document.getElementById('gg').textContent=`${S.gold} G`;document.getElementById('bp').disabled=S.gold<GACHA_COST;
  document.getElementById('pm').textContent='恒久強化: '+Object.keys(PERMS).map(k=>`${PERMS[k].n}+${S.perms[k]||0}`).join(' ・ ')};
 refresh();
 document.getElementById('bb').onclick=showTitle;
 document.getElementById('bp').onclick=()=>{
  if(S.gold<GACHA_COST)return;S.gold-=GACHA_COST;
  const locked=Object.keys(CHARS).filter(id=>!S.unlocked.includes(id));let r;
  if(locked.length&&Math.random()<.25){const id=pick(locked);S.unlocked.push(id);r={c:'#ffc23a',t:'NEW CHARA',n:CHARS[id].n,d:'新キャラ解放！'}}
  else{const ri=rollRar(),k=pick(Object.keys(PERMS)),amt=1+ri;S.perms[k]=(S.perms[k]||0)+amt;r={c:RAR[ri].c,t:RAR[ri].n,n:PERMS[k].n,d:`+${amt}`}}
  saveNow();
  document.getElementById('res').innerHTML=`<div class="gc" style="--c:${r.c}"><div class="gcn">${r.t}</div><div class="gct">${r.n}</div><div class="gct">${r.d}</div></div>`;
  refresh();
 };
}

// ---- js/input.js ----
// ===== 入力（キーボード・画面どこでもドラッグ・スキル/ポーズボタン） =====
const K={};
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();K[k]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(ST==='playing'&&(k===' '||k==='e'))useSkill();
 else if(k==='escape'||k==='p'){if(ST==='playing')pauseGame();else if(ST==='paused')resumeGame()}
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false});

// 触れた場所が操作の中心になるスティック
const stk=document.getElementById('stk'),stkb=document.getElementById('stkb'),SR=50;
let tch=null;
function stickShow(on){stk.style.display=on?'block':'none'}
function stickMove(x,y){
 let dx=x-tch.ox,dy=y-tch.oy,d=Math.hypot(dx,dy);
 if(d>SR){const k=(d-SR)/d;tch.ox+=dx*k;tch.oy+=dy*k;dx=x-tch.ox;dy=y-tch.oy;d=SR}
 G.tv=d<6?null:{x:dx/SR,y:dy/SR};
 stk.style.left=tch.ox+'px';stk.style.top=tch.oy+'px';stkb.style.transform=`translate(${dx}px,${dy}px)`;
}
function stickStart(id,x,y){tch={id,ox:x,oy:y};stickShow(true);stickMove(x,y)}
function stickEnd(){tch=null;G.tv=null;stickShow(false)}
const isBtn=t=>t&&t.closest&&t.closest('#hud button');
document.addEventListener('touchstart',e=>{if(ST!=='playing'||isBtn(e.target))return;e.preventDefault();if(tch)return;const t=e.changedTouches[0];stickStart(t.identifier,t.clientX,t.clientY)},{passive:false});
document.addEventListener('touchmove',e=>{if(ST==='playing')e.preventDefault();if(!tch)return;for(const t of e.changedTouches)if(t.identifier===tch.id){stickMove(t.clientX,t.clientY);break}},{passive:false});
for(const ev of['touchend','touchcancel'])document.addEventListener(ev,e=>{if(!tch)return;for(const t of e.changedTouches)if(t.identifier===tch.id){stickEnd();break}},{passive:false});
document.addEventListener('mousedown',e=>{if(ST!=='playing'||isBtn(e.target)||tch)return;stickStart('m',e.clientX,e.clientY)});
document.addEventListener('mousemove',e=>{if(tch&&tch.id==='m')stickMove(e.clientX,e.clientY)});
document.addEventListener('mouseup',()=>{if(tch&&tch.id==='m')stickEnd()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ST==='playing')pauseGame()});

// ボタン（指で押したときにスティックが出ないようにする）
const skillBtn=document.getElementById('skillBtn'),pauseBtn=document.getElementById('pauseBtn'),skillTxt=document.getElementById('skillTxt');
function bindTap(el,fn){el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();fn()},{passive:false});el.addEventListener('click',e=>{e.stopPropagation();fn()})}
bindTap(skillBtn,()=>useSkill());
bindTap(pauseBtn,()=>pauseGame());

// ---- js/main.js ----
// ===== 起動とメインループ =====
function loop(t){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,Math.max(0,(t-LMT)/1000));LMT=t;
 if(ST==='playing')update(dt);
 render();
 if(ST==='playing')updateSkillBtn();
}
showTitle();
LMT=performance.now();
requestAnimationFrame(loop);

</script>
</body></html>
